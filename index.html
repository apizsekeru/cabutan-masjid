<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#046c4e">
<title>Ganjaran Ilmu Jemaah Masjid</title>
<meta name="description" content="Ganjaran Ilmu Jemaah Masjid — hadir, dengar khutbah, jawab soalan, menang cabutan. Penyertaan adalah percuma.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Penjana QR (qrcodejs) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Penjana PDF (jsPDF) — untuk e-book Ringkasan Ilmu -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* =====================================================================
   1. TOKEN WARNA & TEMA — putih/hijau zamrud + emas lembut, kontras tinggi
   ===================================================================== */
:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bg: #fbfdfc;
  --surface: #ffffff;
  --surface-2: #f1f6f3;
  --text: #06140f;
  --muted: #34473f;
  --border: #cfdcd4;
  --primary: #046c4e;
  --primary-hover: #065f46;
  --primary-soft: #d9f4e7;
  --on-primary: #ffffff;
  --gold: #7d5e17;
  --gold-bright: #d4af5f;
  --gold-soft: #f8f0da;
  --danger: #a01b12;
  --danger-soft: #fde2df;
  --warn: #8a3a05;
  --warn-soft: #fef0c7;
  --shadow-sm: 0 1px 2px rgba(6, 40, 30, .06);
  --shadow: 0 10px 30px -14px rgba(6, 40, 30, .25);
  --shadow-lg: 0 28px 70px -24px rgba(6, 40, 30, .4);
  --radius: 20px;
  --tap: 56px;             /* tinggi minimum butang (mesra warga emas) */
  --c-new: #c69c47;
  --c-reg: #047857;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #04110c; --surface: #0b1e17; --surface-2: #122b22;
    --text: #f2faf6; --muted: #bdd0c8; --border: #2a4a3d;
    --primary: #2fd39b; --primary-hover: #5ee3b5; --primary-soft: #0f3a2c; --on-primary: #02130c;
    --gold: #f0cf7e; --gold-bright: #f0d18a; --gold-soft: #2f2715;
    --danger: #ff8f86; --danger-soft: #3f1715; --warn: #ffd166; --warn-soft: #3a2c0b;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 12px 30px -12px rgba(0,0,0,.6); --shadow-lg: 0 30px 70px -20px rgba(0,0,0,.75);
    --c-new: #f0cf7e; --c-reg: #2fd39b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #04110c; --surface: #0b1e17; --surface-2: #122b22;
  --text: #f2faf6; --muted: #bdd0c8; --border: #2a4a3d;
  --primary: #2fd39b; --primary-hover: #5ee3b5; --primary-soft: #0f3a2c; --on-primary: #02130c;
  --gold: #f0cf7e; --gold-bright: #f0d18a; --gold-soft: #2f2715;
  --danger: #ff8f86; --danger-soft: #3f1715; --warn: #ffd166; --warn-soft: #3a2c0b;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 12px 30px -12px rgba(0,0,0,.6); --shadow-lg: 0 30px 70px -20px rgba(0,0,0,.75);
  --c-new: #f0cf7e; --c-reg: #2fd39b;
  color-scheme: dark;
}

/* =====================================================================
   2. ASAS — fon asas 18px (1rem = 18px)
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; font-size: 112.5%; }
body {
  margin: 0; font-family: var(--font); font-size: 1rem; line-height: 1.55;
  background: var(--bg); color: var(--text); min-height: 100vh;
  transition: background-color .3s ease, color .3s ease;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; letter-spacing: -.02em; }
h1 { font-size: clamp(1.45rem, 4vw, 2rem); font-weight: 800; }
h2 { font-size: 1.28rem; font-weight: 800; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0 0 .8em; }
a { color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.center { text-align: center; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; border-radius: 6px; }

/* Header ringkas (tiada nav untuk jemaah) */
.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.topbar-inner { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; text-decoration: none; color: var(--text); min-height: var(--tap); }
.brand-mark { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #065f46, #047857); box-shadow: inset 0 0 0 1.5px rgba(212,175,95,.55); }
.brand-text { min-width: 0; }
.brand-title { display: block; font-weight: 800; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { display: block; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: var(--tap); height: var(--tap); flex: none; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: transform .2s, background .2s; }
.icon-btn:hover { transform: translateY(-1px); background: var(--surface-2); }
.icon-btn svg { width: 24px; height: 24px; }
body.mode-skrin .topbar, body.mode-skrin footer { display: none; }
.demo-pill { font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }

main { position: relative; z-index: 1; max-width: 1160px; margin: 0 auto; padding: 20px 16px 28px; }
body.mode-skrin main { max-width: none; padding: 0; }
footer.foot { text-align: center; font-size: .88rem; color: var(--muted); padding: 10px 16px 24px; }
.fade-up { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Komponen asas */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); min-width: 0; }
.card + .card { margin-top: 14px; }
.card.accent { border-top: 4px solid var(--gold-bright); }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title h2, .card-title h3 { margin: 0; }
.grid { display: grid; gap: 14px; }
.grid > * { min-width: 0; }
.grid > .card + .card { margin-top: 0; }
@media (min-width: 700px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.page-head { margin: 4px 0 18px; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); margin-bottom: 6px; }
.head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 12px 20px; border-radius: 14px; border: 1.5px solid transparent; font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none; line-height: 1.2; text-align: center; transition: transform .15s, background .2s, opacity .2s, box-shadow .2s; -webkit-tap-highlight-color: transparent; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 18px -8px var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-gold { background: linear-gradient(135deg, #e2c07a, #c69c47); color: #241a03; box-shadow: 0 6px 18px -8px #c69c47; }
.btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.btn-wa { background: #25d366; color: #032b15; }
.btn-sm { padding: 8px 14px; font-size: .9rem; }
.btn-lg { padding: 16px 26px; font-size: 1.1rem; min-height: 64px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row.center { justify-content: center; }
.link-btn { background: none; border: 0; color: var(--primary); text-decoration: underline; cursor: pointer; font-size: .95rem; padding: 4px 8px; min-height: var(--tap); font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field label { font-weight: 700; font-size: .95rem; }
.input, .field input, .field select, .field textarea { width: 100%; min-height: var(--tap); padding: 12px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface-2); font-size: 1rem; transition: border-color .2s, box-shadow .2s, background .2s; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 20%, transparent); }
.field textarea, textarea.input { resize: vertical; min-height: 100px; }
.field.invalid input { border-color: var(--danger); }
.field .error { font-size: .92rem; color: var(--danger); font-weight: 700; }
.hint { font-size: .88rem; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .field { flex: 1 1 140px; }
.check { display: flex; align-items: center; gap: 10px; min-height: var(--tap); cursor: pointer; font-weight: 600; }
.check input { width: 24px; height: 24px; accent-color: var(--primary); }

.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: .95rem; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.note svg { width: 22px; height: 22px; flex: none; margin-top: 1px; color: var(--gold); }
.note.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.note.warn svg { color: var(--warn); }
.note.ok { background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
.note.ok svg { color: var(--primary); }
.free-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: .9rem; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.badge.ok { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.badge.draft { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.live { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.badge.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; }
.streak { display: inline-flex; align-items: center; gap: 4px; padding: 3px 11px; border-radius: 999px; font-size: .85rem; font-weight: 800; white-space: nowrap; background: #ffe7c2; color: #6b3300; }
:root[data-theme="dark"] .streak { background: #4a2a06; color: #ffcf8a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .streak { background: #4a2a06; color: #ffcf8a; } }
.medal-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 11px; border-radius: 999px; font-size: .82rem; font-weight: 800; background: var(--gold-soft); color: var(--gold); white-space: nowrap; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
td .badges { justify-content: flex-start; margin-top: 4px; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

/* =====================================================================
   3. UI JEMAAH (#j) — satu skrin pada satu masa
   ===================================================================== */
.jwrap { max-width: 540px; margin: 0 auto; min-height: calc(100vh - 170px); display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.jscreen { text-align: center; padding: 30px 20px; }
.jscreen h1 { font-size: 1.7rem; }
.jscreen p { color: var(--muted); font-size: 1.05rem; }
.big-icon { width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 30px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
.big-icon svg { width: 48px; height: 48px; }
.big-icon.gold { background: var(--gold-soft); color: var(--gold); }
.hourglass svg { animation: flip 2.4s ease-in-out infinite; }
@keyframes flip { 0%, 40% { transform: rotate(0); } 50%, 90% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
.spin-icon svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.session-chip { display: inline-block; padding: 6px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; font-size: .95rem; margin-bottom: 14px; }
.ticket-count { display: inline-flex; align-items: center; gap: 12px; margin: 6px 0 4px; font-size: 3.6rem; font-weight: 800; letter-spacing: -.04em; color: var(--gold); }
.ticket-count svg { width: 50px; height: 50px; color: var(--gold-bright); }
.dots { display: inline-flex; gap: 6px; margin-top: 10px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }

.timer-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); font-weight: 700; }
.timer-bar .time { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.3rem; color: var(--primary); }
.timer-bar.urgent .time { color: var(--danger); animation: pulse 1s infinite; }
.progress { height: 10px; border-radius: 10px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--gold-bright)); transition: width .4s ease; }
.q-text { font-size: 1.25rem; line-height: 1.45; margin-bottom: 18px; }
.opts { display: grid; gap: 12px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 16px; text-align: left; cursor: pointer; border: 2px solid var(--border); border-radius: 16px; background: var(--surface-2); font-size: 1.05rem; font-weight: 600; transition: border-color .2s, background .2s, transform .15s; }
.opt:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); }
.opt:active { transform: scale(.99); }
.opt-key { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; background: var(--surface); border: 2px solid var(--border); transition: all .2s; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.sel .opt-key { background: var(--primary); color: var(--on-primary); border-color: var(--primary); transform: scale(1.06); }
.nav-row { display: flex; gap: 10px; }
.nav-row .btn { flex: 1; }
.review-item { padding: 12px 0; border-bottom: 1px dashed var(--border); text-align: left; }
.review-item:last-child { border-bottom: 0; }
.ok-text { color: var(--primary); font-weight: 800; }
.bad-text { color: var(--danger); font-weight: 800; }
.points { margin: 0; padding-left: 1.2em; text-align: left; }
.points li { margin-bottom: 8px; }
.poster-wrap { max-width: 420px; margin: 0 auto; }
.poster-wrap canvas { width: 100%; height: auto; display: block; border-radius: 14px; box-shadow: var(--shadow); }

/* =====================================================================
   4. PANEL AJK
   ===================================================================== */
.atabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px; margin-bottom: 18px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 18px; scrollbar-width: none; }
.atabs::-webkit-scrollbar { display: none; }
.atab { flex: 1 0 auto; min-height: var(--tap); padding: 8px 16px; border-radius: 14px; border: 0; background: none; cursor: pointer; font-weight: 700; font-size: .95rem; color: var(--muted); white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.atab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 16px; overflow-x: auto; margin-bottom: 14px; border: 1px solid var(--border); }
.tab { flex: 1 0 auto; min-height: var(--tap); padding: 8px 14px; border-radius: 12px; border: 0; background: none; cursor: pointer; font-weight: 700; font-size: .92rem; color: var(--muted); }
.tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.tab .count { font-size: .76rem; padding: 1px 7px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); margin-left: 4px; }

.stepper { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 18px; }
.step { flex: 1 1 90px; padding: 8px 10px; border-radius: 12px; font-size: .82rem; font-weight: 700; text-align: center; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.step.done { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.step.now { background: var(--primary); color: var(--on-primary); border-color: transparent; box-shadow: 0 6px 18px -8px var(--primary); }
.ctl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 900px) { .ctl-grid { grid-template-columns: repeat(4, 1fr); } }
.ctl { min-height: 96px; flex-direction: column; font-size: 1.05rem; border-radius: 18px; }
.ctl svg { width: 28px; height: 28px; }
.ctl small { font-weight: 600; font-size: .78rem; opacity: .85; }
.live-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
.stat b { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: .85rem; color: var(--muted); font-weight: 600; }

.admin-layout { display: grid; gap: 16px; }
.admin-layout > * { min-width: 0; }
@media (min-width: 960px) { .admin-layout { grid-template-columns: 320px 1fr; align-items: start; } }
.s-list { display: grid; gap: 8px; max-height: 60vh; overflow: auto; }
.s-item { text-align: left; width: 100%; min-height: var(--tap); padding: 12px; border-radius: 12px; cursor: pointer; border: 2px solid var(--border); background: var(--surface-2); }
.s-item.active { border-color: var(--primary); background: var(--primary-soft); }
.s-item b { display: block; font-size: .95rem; margin-bottom: 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .88rem; color: var(--muted); align-items: center; }
.tpl-item { padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); margin-bottom: 10px; }
.tpl-item b { display: block; font-size: 1.02rem; }
.tpl-item .btn-row { margin-top: 10px; gap: 6px; }
.q-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: var(--surface-2); margin-bottom: 10px; }
.q-card.is-ok { border-left: 5px solid var(--primary); }
.q-card.is-draft { border-left: 5px solid var(--warn); }
.q-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.q-card-head .spacer { flex: 1; }
.q-num { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: .92rem; }
.opt-edit { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.opt-edit input[type="radio"] { width: 26px; height: 26px; accent-color: var(--primary); flex: none; }
.opt-edit .k { width: 22px; font-weight: 800; color: var(--muted); flex: none; }
.oneclick { border: 2px solid color-mix(in srgb, var(--gold-bright) 60%, var(--border)); background: linear-gradient(180deg, var(--gold-soft), var(--surface) 55%); }

.table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }

<script>

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* Telefon Malaysia */
function normalizePhone(raw) {
  let p = String(raw || '').replace(/[\s\-().]/g, '');

/* Toast & modal */
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = `toast ${type}`; el.setAttribute('role', type === 'error' ? 'alert' : 'status'); el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 3200);
}
/** Modal generik. onAction(value, el) → false untuk kekal terbuka (validasi). */
function openModal({ title = '', html = '', actions = [{ label: 'Tutup', cls: 'btn-ghost', value: null }], onOpen, onAction } = {}) {
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">${title ? `<h3>${esc(title)}</h3>` : ''}<div class="modal-body">${html}</div>
      <div class="btn-row">${actions.map((a, i) => `<button type="button" class="btn ${a.cls || 'btn-ghost'}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
    (document.fullscreenElement || document.body).appendChild(back);
    const done = (v) => { back.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', (e) => {
      if (e.target === back) return done(null);
      const b = e.target.closest('[data-i]'); if (!b) return;
      const v = actions[+b.dataset.i].value;
      if (onAction && onAction(v, back) === false) return;
      done(v);
    });
    onOpen && onOpen(back);
    const f = back.querySelector('.modal-body input, .modal-body select') || back.querySelector('.btn-row .btn:last-child');
    f && f.focus();
  });
}
const confirmDialog = (msg, ok = 'Ya, teruskan', danger = false) => openModal({ title: 'Pengesahan', html: `<p>${msg}</p>`, actions: [{ label: 'Batal', cls: 'btn-ghost', value: false }, { label: ok, cls: danger ? 'btn-danger' : 'btn-primary', value: true }] });

}

/* =====================================================================
   3. LOGIK DOMAIN (fungsi tulen atas objek data `d`)
   ---------------------------------------------------------------------
   Struktur data (schemaVersion 3) — sama dengan jadual dalam schema.sql:
   settings      { masjidName, pinHash, tokenSecret, streak{threshold,bonus}, geo{enabled,lat,lng,radius} }
   templates     { id, name, title, speaker, weekday, startTime, endTime, answerMinutes, prizes[] }
   sessions      { id, templateId, title, speaker, date, startTime, endTime, answerMinutes,
                   transcript, summary[], prizes[], state, stateAt, questionsOpenedAt, questionsCloseAt, rev }
   questions     { id, sessionId, text, options[4], correctIndex, status('draf'|'lulus'), source }
   participants  { id, name, phone(unik), secret }
   registrations { id, sessionId, participantId, regNo, checkinAt, dist }  ← juga sumber streak
   answers       { id, sessionId, participantId, questionId, choiceIndex, isCorrect }
   winners       { id, sessionId, participantId, prize, order, spinMs, revealAt, wheel[] }
   ===================================================================== */
const Logic = {
  approved(d, sid) { return d.questions.filter((q) => q.sessionId === sid && q.status === 'lulus'); },
  /** Rantaian sesi satu templat (bukan draf), ikut kronologi. */
  chain(d, tid) { return d.sessions.filter((s) => s.templateId === tid && s.state !== 'draft').sort((a, b) => sessionKey(a).localeCompare(sessionKey(b))); },
  attended(d, pid) { return new Set(d.registrations.filter((r) => r.participantId === pid).map((r) => r.sessionId)); },
  /** Streak pada sesi: bilangan sesi berturut-turut (templat sama) berakhir di sesi ini. */
  streakAt(d, pid, sid, cache = {}) {
    const s = d.sessions.find((x) => x.id === sid);
    if (!s || !s.templateId) return 0;
    const chain = cache.chain || this.chain(d, s.templateId);
    const att = cache.att || this.attended(d, pid);
    const idx = chain.findIndex((x) => x.id === sid);
    if (idx < 0 || !att.has(sid)) return 0;
    let n = 0;
    for (let i = idx; i >= 0 && att.has(chain[i].id); i--) n++;
    return n;
  },
  /** Tiket bonus pada setiap gandaan ambang streak (cth. 3, 6, 9…). */
  bonusFor(d, pid, sid, cache) {
    const { threshold, bonus } = d.settings.streak;
    if (!(threshold > 0 && bonus > 0)) return 0;
    const st = this.streakAt(d, pid, sid, cache);
    return st > 0 && st % threshold === 0 ? bonus : 0;
  },
  streakStats(d, pid) {
    const att = this.attended(d, pid);
    const tids = new Set(d.sessions.filter((s) => att.has(s.id) && s.templateId).map((s) => s.templateId));
    let current = 0, best = 0;
    for (const tid of tids) {
      const chain = this.chain(d, tid); // rantaian sudah mengecualikan draf; sesi dibuka awal tetap dikira
      let run = 0;
      chain.forEach((s, i) => {
        if (att.has(s.id)) { run++; best = Math.max(best, run); }
        else if (!(i === chain.length - 1 && ['registration', 'prepared', 'questions'].includes(s.state))) run = 0; // sesi sedang berjalan belum dikira terlepas
      });
      current = Math.max(current, run);
    }
    return { current, best };
  },
  /** Tiket sesi: 1 entri per jawapan betul + tiket bonus streak. */
  tickets(d, sid) {
    const out = d.answers.filter((a) => a.sessionId === sid && a.isCorrect).map((a) => a.participantId);
    const s = d.sessions.find((x) => x.id === sid);
    if (s && s.templateId) {
      const chain = this.chain(d, s.templateId);
      d.registrations.filter((r) => r.sessionId === sid).forEach((r) => {
        const b = this.bonusFor(d, r.participantId, sid, { chain });
        for (let i = 0; i < b; i++) out.push(r.participantId);
      });
    }
    return out;
  },
  ticketsOf(d, sid, pid) {
    const correct = d.answers.filter((a) => a.sessionId === sid && a.participantId === pid && a.isCorrect).length;
    const reg = d.registrations.some((r) => r.sessionId === sid && r.participantId === pid);
    const bonus = reg ? this.bonusFor(d, pid, sid) : 0;
    return { correct, bonus, total: correct + bonus };
  },
  winners(d, sid) { return d.winners.filter((w) => w.sessionId === sid).sort((a, b) => a.order - b.order); },
  /** Tiket layak — pemenang sesi ini dikecualikan (seorang menang sekali setiap sesi). */
  pool(d, sid) { const taken = new Set(this.winners(d, sid).map((w) => w.participantId)); return this.tickets(d, sid).filter((p) => !taken.has(p)); },
  /** Semak peralihan keadaan sesi. Pulangkan '' jika sah, atau sebab (BM). */
  transitionError(d, s, to) {
    const from = { registration: ['draft'], prepared: ['registration'], questions: ['prepared'], closed: ['questions'], drawing: ['closed'], done: ['closed', 'drawing'] }[to];
    if (!from) return 'Keadaan tidak sah';
    if (!from.includes(s.state)) return `Tidak boleh tukar dari "${STATE_LABEL[s.state]}" ke "${STATE_LABEL[to]}"`;
    const n = this.approved(d, s.id).length;
    if (['prepared', 'questions'].includes(to) && (n < CONFIG.MIN_Q || n > CONFIG.MAX_Q)) return `Perlu ${CONFIG.MIN_Q}–${CONFIG.MAX_Q} soalan diluluskan (kini ${n})`;
    if (to === 'drawing' && !(s.prizes || []).length) return 'Tetapkan sekurang-kurangnya satu hadiah dahulu';
    return '';
  },
  ranking(d) {
    const map = new Map(d.participants.map((p) => [p.id, { p, sessions: new Set(), correct: 0, answered: 0, wins: 0 }]));
    d.registrations.forEach((r) => map.get(r.participantId)?.sessions.add(r.sessionId));
    d.answers.forEach((a) => { const m = map.get(a.participantId); if (m) { m.answered++; if (a.isCorrect) m.correct++; } });
    d.winners.forEach((w) => { const m = map.get(w.participantId); if (m) m.wins++; });
    return [...map.values()].filter((r) => r.sessions.size > 0)
      .map((r) => ({ ...r, sessionCount: r.sessions.size, streak: this.streakStats(d, r.p.id) }))
      .sort((a, b) => b.sessionCount - a.sessionCount || b.streak.current - a.streak.current || b.correct - a.correct || a.p.name.localeCompare(b.p.name));
  },
  /**
   * Paparan jemaah — SAHAJA maklumat yang jemaah boleh lihat.
   * (Versi SQL yang setara: gij_jemaah_view dalam schema.sql.)
   */
  jemaahView(d, sid, pid, secret, now = Date.now()) {
    const base = { now, masjidName: d.settings.masjidName, geo: d.settings.geo };
    const s = d.sessions.find((x) => x.id === sid);
    if (!s) return { ...base, ok: false, reason: 'notfound' };
    const p = pid ? d.participants.find((x) => x.id === pid && x.secret === secret) : null;
    const reg = p ? d.registrations.find((r) => r.sessionId === sid && r.participantId === p.id) : null;
    const qs = this.approved(d, sid);
    const mine = reg ? d.answers.filter((a) => a.sessionId === sid && a.participantId === p.id) : [];
    const ws = this.winners(d, sid);
    const revealed = ws.filter((w) => Date.parse(w.revealAt) <= now);
    const pending = ws.filter((w) => Date.parse(w.revealAt) > now).map((w) => Date.parse(w.revealAt));
    const myWin = p ? revealed.find((w) => w.participantId === p.id) : null;
    const closeAt = s.questionsCloseAt ? Date.parse(s.questionsCloseAt) : null;
    const answering = s.state === 'questions' && closeAt && now <= closeAt;
    const t = reg ? this.ticketsOf(d, sid, p.id) : null;
    const byQ = new Map(mine.map((a) => [a.questionId, a]));
    return {
      ...base, ok: true, knownDevice: !!p,
      session: { id: s.id, title: s.title, speaker: s.speaker, date: s.date, startTime: s.startTime, endTime: s.endTime, state: s.state, questionsCloseAt: s.questionsCloseAt, prizeInstructions: s.prizeInstructions || '', qCount: qs.length },
      registered: !!reg, regNo: reg?.regNo ?? null, name: p?.name ?? null,
      streak: reg ? this.streakAt(d, p.id, sid) : 0, bonus: t?.bonus || 0,
      answered: mine.length > 0,
      tickets: reg && (mine.length || !['draft', 'registration'].includes(s.state) && !answering) ? t.total : null,
      questions: answering && reg && !mine.length ? qs.map((q) => ({ id: q.id, text: q.text, options: optionOrder(p.id, q.id).map((i) => ({ i, text: q.options[i] })) })) : null,
      win: myWin ? { prize: myWin.prize, order: myWin.order } : null,
      pendingRevealAt: pending.length ? Math.min(...pending) : null,
      review: s.state === 'done' ? {
        summary: s.summary || [],
        items: qs.map((q) => { const a = byQ.get(q.id); return { text: q.text, answer: q.options[q.correctIndex], mine: a ? q.options[a.choiceIndex] : null, correct: a ? a.isCorrect : null }; }),
      } : null,
    };
  },
};

/* =====================================================================
   4. KOD SERTAI STATIK (QR bercetak) — dalam Supabase dibuat di pelayan
   ---------------------------------------------------------------------
   Gantikan token/checkin dinamik 60 saat: kod sertai kini STATIK per sesi
   (setara gij__sign/gij_join_code/gij__join_ok dalam schema.sql), sah
   selagi sesi berstatus 'registration' — tiada had masa, tiada skrin besar.
   ===================================================================== */
/** Jam pelayan: offset antara jam peranti & pelayan (Supabase). Jam komputer/telefon yang
    tidak tepat tidak boleh memendekkan masa menjawab. */
const Clock = { offset: 0, now() { return Date.now() + this.offset; } };
const JoinCode = {
  /** Setara gij__sign(p_msg) dalam schema.sql (mod demo — pelayan sebenar guna HMAC-SHA256). */
  sign(secret, msg) { return (hashPin(`${secret}|${msg}`) + hashPin(`${msg}|${secret}`)).slice(0, 12); },
  /** Setara gij_join_code(p_pin, p_sid): kod tetap bagi satu sesi. */
  forSession(secret, sid) { return this.sign(secret, 'reg|' + sid); },
  /** Setara gij__join_ok(p_sid, p_code). */
  ok(secret, sid, code) { return !!code && code === this.forSession(secret, sid); },
  /**
   * Semakan PANTAS di PELAYAR (UX sahaja, BUKAN sempadan keselamatan — gij_register/LocalAPI.register
   * di pelayan tetap menyemak semula). Dalam mod demo, rahsia sesi boleh dibaca terus daripada
   * localStorage (pelayar = "pelayan"). Dalam mod Supabase, rahsia tidak sampai ke pelayar, jadi
   * biarkan pengesahan sebenar berlaku semasa hantar pendaftaran ke gij_register.
   */
  checkClientSide(sid, code) {
    if (MODE !== 'demo') return !!code;
    return this.ok(LocalAPI.read().settings.tokenSecret, sid, code);
  },
};

/* =====================================================================
   5. BUS MASA NYATA — BroadcastChannel (demo) / Supabase Realtime
   ===================================================================== */
const Bus = {
  handlers: new Set(), bc: null, t: null,
  init() {
    if (MODE === 'demo') {
      try { this.bc = new BroadcastChannel('gij-sync'); this.bc.onmessage = () => this.fire(); } catch {}
      window.addEventListener('storage', (e) => { if (e.key === CONFIG.STORAGE_KEY) this.fire(); });
    }
  },
  /** Panggil selepas setiap tulisan: maklumkan tab lain + tab ini. */
  notify() { try { this.bc && this.bc.postMessage({ at: Date.now() }); } catch {} this.fire(); },
  fire() { clearTimeout(this.t); this.t = setTimeout(() => this.handlers.forEach((h) => { try { h(); } catch (e) { console.warn(e); } }), 60); },
  on(fn) { this.handlers.add(fn); return () => this.handlers.delete(fn); },
};

/* =====================================================================
   6. API — satu antara muka, dua pelaksanaan (Local / Supabase)
   ===================================================================== */
const LocalAPI = {
  empty() {
    return {
      schemaVersion: CONFIG.SCHEMA_VERSION,
      settings: { masjidName: 'Masjid Al-Hidayah', pinHash: hashPin(CONFIG.DEFAULT_PIN), tokenSecret: randomSecret(), streak: { threshold: 3, bonus: 2 }, geo: { enabled: false, lat: null, lng: null, radius: 150 } },
      templates: [], sessions: [], questions: [], participants: [], registrations: [], answers: [], winners: [],
    };
  },
  /** Migrasi v1/v2 → v3 (idempoten). */
  migrate(d) {
    const base = this.empty();
    d = d && typeof d === 'object' ? d : {};
    d.settings = { ...base.settings, ...(d.settings || {}) };
    d.settings.streak = { ...base.settings.streak, ...(d.settings.streak || {}) };
    d.settings.geo = { ...base.settings.geo, ...(d.settings.geo || {}) };
    if (!d.settings.tokenSecret) d.settings.tokenSecret = base.settings.tokenSecret;
    ['templates', 'sessions', 'questions', 'participants', 'registrations', 'answers', 'winners'].forEach((k) => { if (!Array.isArray(d[k])) d[k] = []; });
    const t0 = today();
    d.templates.forEach((t) => { if (t.answerMinutes == null) t.answerMinutes = Math.min(60, Math.max(1, minutesBetween(t.startTime, t.endTime) || 5)); if (!Array.isArray(t.prizes)) t.prizes = []; });
    d.sessions.forEach((s) => {
      if (s.templateId === undefined) s.templateId = null;
      if (!Array.isArray(s.summary)) s.summary = [];
      if (!Array.isArray(s.prizes)) s.prizes = [];
      if (s.transcript == null) s.transcript = '';
      if (s.prizeInstructions == null) s.prizeInstructions = '';
      if (!s.state) { // v2: published + tetingkap masa → keadaan
        const hasW = d.winners.some((w) => w.sessionId === s.id);
        s.state = !s.published ? 'draft' : (s.date < t0 || hasW) ? 'done' : 'registration';
      }
      delete s.published;
      if (s.answerMinutes == null) s.answerMinutes = Math.min(60, Math.max(1, minutesBetween(s.startTime, s.endTime) || 5));
      if (s.questionsCloseAt === undefined) s.questionsCloseAt = null;
      if (s.questionsOpenedAt === undefined) s.questionsOpenedAt = null;
      if (!s.stateAt) s.stateAt = s.createdAt || nowISO();
      if (s.rev == null) s.rev = 0;
    });
    d.questions.forEach((q) => { if (!['mudah', 'sederhana', 'susah'].includes(q.difficulty)) q.difficulty = 'sederhana'; });
    d.participants.forEach((p) => { if (!p.secret) p.secret = randomSecret(); });
    d.registrations.forEach((r) => {
      if (!r.checkinAt) r.checkinAt = r.createdAt || nowISO();
      if (r.dist === undefined) r.dist = r.geoDist ?? null;
      delete r.geoDist; delete r.tokenSlot;
    });
    d.winners.forEach((w) => { if (!w.revealAt) w.revealAt = w.createdAt || nowISO(); if (w.spinMs == null) w.spinMs = 0; if (!Array.isArray(w.wheel)) w.wheel = []; });
    d.schemaVersion = CONFIG.SCHEMA_VERSION;

  },
  read() {
    try {
      const raw = localStorage.getItem(CONFIG.STORAGE_KEY);

      const ver = parsed?.schemaVersion;
      const d = parsed ? this.migrate(parsed) : this.empty();
      if (!parsed || ver !== CONFIG.SCHEMA_VERSION) this.persist(d);
      return d;
    } catch (e) { console.warn('Data rosak, guna pangkalan kosong', e); return this.empty(); }
  },
  persist(d) { try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(d)); } catch { toast('Gagal menyimpan data (storan penuh?)', 'error'); } },
  /** Transaksi: baca data TERKINI, ubah, simpan, maklumkan semua tab. */
  tx(fn) { const d = this.read(); const r = fn(d); if (!r || r.write !== false) { this.persist(d); Bus.notify(); } return r; },
  touch(d, sid) { const s = d.sessions.find((x) => x.id === sid); if (s) s.rev = (s.rev || 0) + 1; },

  /* ---------- AJK ---------- */
  async adminCheck(pin) { return hashPin(pin) === this.read().settings.pinHash; },
  async isDefaultPin() { return this.read().settings.pinHash === hashPin(CONFIG.DEFAULT_PIN); },
  async snapshot() { return this.read(); },
  /** ops: [{t, op:'upsert', row} | {t, op:'delete', id} | {t:'settings', row} | {t:'pin', old, pin}] */
  async write(ops) {
    return this.tx((d) => {
      for (const o of ops) {
        if (o.t === 'settings') { Object.assign(d.settings, o.row); continue; }
        if (o.t === 'pin') { if (hashPin(o.old) !== d.settings.pinHash) return { ok: false, write: false, reason: 'PIN semasa salah' }; d.settings.pinHash = hashPin(o.pin); continue; }
        if (o.t === 'replace') { const keep = d.settings; Object.keys(d).forEach((k) => delete d[k]); Object.assign(d, this.migrate(o.data)); if (o.keepSettings) d.settings = keep; continue; }
        if (o.t === 'participants') { // padam peserta (cth. permintaan PDPA) beserta rekodnya
          if (o.op !== 'delete') continue;
          d.participants = d.participants.filter((p) => p.id !== o.id);
          ['registrations', 'answers', 'winners'].forEach((k) => { d[k] = d[k].filter((r) => r.participantId !== o.id); });
          continue;
        }
        const list = d[o.t]; if (!Array.isArray(list)) continue;
        if (o.op === 'delete') {
          d[o.t] = list.filter((r) => r.id !== o.id);

          if (o.t === 'questions') d.answers = d.answers.filter((a) => a.questionId !== o.id);

          const i = list.findIndex((r) => r.id === o.row.id);

  async setState(sid, to) {
    return this.tx((d) => {

      const err = Logic.transitionError(d, s, to);
      if (err) return { ok: false, write: false, reason: err };
      const now = Date.now();
      s.state = to; s.stateAt = new Date(now).toISOString();
      if (to === 'questions') { s.questionsOpenedAt = s.stateAt; s.questionsCloseAt = new Date(now + s.answerMinutes * 60000).toISOString(); }

  /** Kod sertai statik (setara gij_join_code) — dibenamkan dalam pautan QR bercetak. */
  async joinCode(sid) { return JoinCode.forSession(this.read().settings.tokenSecret, sid); },
  /** Cabutan: pemenang ditentukan DAHULU (rawak adil ikut tiket) → roda berhenti padanya. */
  async draw(sid) {
    return this.tx((d) => {
      const s = d.sessions.find((x) => x.id === sid);
      if (!s || s.state !== 'drawing') return { ok: false, write: false, reason: 'state' };
      const ws = Logic.winners(d, sid);
      const prize = (s.prizes || [])[ws.length];
      if (!prize) return { ok: false, write: false, reason: 'noprize' };
      const now = Date.now();
      if (ws.some((w) => Date.parse(w.revealAt) > now)) return { ok: false, write: false, reason: 'spinning' };
      const pool = Logic.pool(d, sid);
      if (!pool.length) return { ok: false, write: false, reason: 'nopool' };
      const winnerId = pool[randInt(pool.length)];          // berpemberat ikut bilangan tiket
      const others = shuffle([...new Set(pool)].filter((x) => x !== winnerId)).slice(0, CONFIG.WHEEL_MAX - 1);
      const wheel = shuffle([winnerId, ...others]);
      const spinMs = CONFIG.SPIN_MIN_MS + randInt(CONFIG.SPIN_MAX_MS - CONFIG.SPIN_MIN_MS + 1);
      const w = { id: uid('w_'), sessionId: sid, participantId: winnerId, prize, order: ws.length + 1, spinMs, revealAt: new Date(now + spinMs + 400).toISOString(), wheel, createdAt: new Date(now).toISOString() };
      d.winners.push(w); this.touch(d, sid);
      const nameOf = (id) => d.participants.find((p) => p.id === id)?.name || '-';
      return { ok: true, winner: { ...w, name: nameOf(winnerId) }, wheel: wheel.map((id) => ({ id, name: nameOf(id) })) };
    });
  },

  /* ---------- Jemaah ---------- */
  /** Carian no. telefon: HANYA nama bertopeng (privasi). */
  async lookup(phone) { const p = this.read().participants.find((x) => x.phone === phone); return p ? { masked: maskName(p.name) } : null; },
  /**
   * Daftar hadir. Peserta sedia ada disahkan dengan SAMA ADA rahsia peranti (peranti yang diingati)
   * ATAU nama penuh yang sepadan. 5 cubaan nama salah → dikunci 15 minit.

  async register({ sid, ticket, name, phone, dist = null, secret = null }) {
    return this.tx((d) => {
      const s = d.sessions.find((x) => x.id === sid);
      if (!s) return { ok: false, write: false, reason: 'notfound' };
      if (s.state !== 'registration') return { ok: false, write: false, reason: 'closed' };
      if (!JoinCode.ok(d.settings.tokenSecret, sid, ticket)) return { ok: false, write: false, reason: 'expired' };
      phone = normalizePhone(phone);
      if (!isValidPhone(phone)) return { ok: false, write: false, reason: 'phone' };
      let p = d.participants.find((x) => x.phone === phone);
      if (!p) {
        name = String(name || '').trim().replace(/\s+/g, ' ');
        if (name.length < 3) return { ok: false, write: false, reason: 'name' };

        const n = normName(name);

        p.nameFails = 0;
      }
      let r = d.registrations.find((x) => x.sessionId === sid && x.participantId === p.id);
      if (!r) {
        r = { id: uid('r_'), sessionId: sid, participantId: p.id, regNo: d.registrations.filter((x) => x.sessionId === sid).reduce((m, x) => Math.max(m, x.regNo), 0) + 1, checkinAt: nowISO(), dist, createdAt: nowISO() };
        d.registrations.push(r); this.touch(d, sid);

    });
  },
  async submit({ sid, pid, secret, answers }) {
    return this.tx((d) => {
      const s = d.sessions.find((x) => x.id === sid);
      const p = d.participants.find((x) => x.id === pid && x.secret === secret);
      if (!s || !p || !d.registrations.some((r) => r.sessionId === sid && r.participantId === pid)) return { ok: false, write: false, reason: 'unverified' };
      if (d.answers.some((a) => a.sessionId === sid && a.participantId === pid)) return { ok: false, write: false, reason: 'duplicate' };
      const now = Date.now();
      if (s.state !== 'questions' || !s.questionsCloseAt || now > Date.parse(s.questionsCloseAt) + CONFIG.ANSWER_GRACE_MS) return { ok: false, write: false, reason: 'closed' };

      for (const q of Logic.approved(d, sid)) {
        const ci = Number(answers?.[q.id]);
        if (answers?.[q.id] === undefined || !Number.isInteger(ci) || ci < 0 || ci > 3) continue;
        rows.push({ id: uid('a_'), sessionId: sid, participantId: pid, questionId: q.id, choiceIndex: ci, isCorrect: ci === q.correctIndex, createdAt: nowISO() });
      }
      if (!rows.length) return { ok: false, write: false, reason: 'empty' };
      d.answers.push(...rows); this.touch(d, sid);
      return { ok: true, count: rows.length };
    });

  async jemaahView(sid, pid, secret) { return Logic.jemaahView(this.read(), sid, pid, secret); },

/* ---------- Supabase (RPC — lihat schema.sql). Belum diuji dengan projek sebenar. ---------- */
const camel = (k) => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const snake = (k) => k.replace(/[A-Z]/g, (c) => '_' + c.toLowerCase());
const mapKeys = (o, f) => Object.fromEntries(Object.entries(o).map(([k, v]) => [f(k), v]));
const SupaAPI = {
  sb: null,
  async init() {

    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    // Semua skrin langgan perubahan jadual sessions (rev/state dikemas kini oleh setiap RPC)
    await this.syncClock(); setInterval(() => this.syncClock(), 10 * 60 * 1000);
    this.sb.channel('gij-sessions').on('postgres_changes', { event: '*', schema: 'public', table: 'sessions' }, () => Bus.fire()).subscribe();
  },
  pin() { return SS.get(K.pin) || ''; },
  async syncClock() {
    try { const t0 = Date.now(); const v = await this.rpc('gij_jemaah_view', { p_sid: '', p_pid: '', p_secret: '' }); const t1 = Date.now(); if (v && v.now) Clock.offset = v.now - Math.round((t0 + t1) / 2); }
    catch (e) { console.warn('Gagal segerak jam pelayan', e); }
  },
  async rpc(fn, args) { const { data, error } = await this.sb.rpc(fn, args); if (error) throw error; return data; },
  async adminCheck(pin) { return !!(await this.rpc('gij_admin_check', { p_pin: pin })); },
  async isDefaultPin() { return false; },
  async snapshot() {
    const d = await this.rpc('gij_admin_snapshot', { p_pin: this.pin() });
    const out = { schemaVersion: 3, settings: d.settings };
    ['templates', 'sessions', 'questions', 'participants', 'registrations', 'answers', 'winners'].forEach((k) => { out[k] = (d[k] || []).map((r) => mapKeys(r, camel)); });
    return out;
  },
  async write(ops) {
    const conv = ops.map((o) => (o.row && !['settings'].includes(o.t) ? { ...o, row: mapKeys(o.row, snake) } : o));
    try { await this.rpc('gij_admin_write', { p_pin: this.pin(), p_ops: conv }); return { ok: true }; } catch (e) { return { ok: false, reason: e.message }; }
  },
  async setState(sid, to) { return this.rpc('gij_set_state', { p_pin: this.pin(), p_sid: sid, p_state: to }); },
  async joinCode(sid) { return this.rpc('gij_join_code', { p_pin: this.pin(), p_sid: sid }); },
  async draw(sid) { return this.rpc('gij_draw', { p_pin: this.pin(), p_sid: sid }); },
  // Lapisan tambahan: papar perkataan pertama sahaja walaupun pelayan memulangkan lebih
  async lookup(phone) { const n = await this.rpc('gij_lookup', { p_phone: phone }); return n ? { masked: String(n).split(' ')[0] } : null; },
  async register({ sid, ticket, name, phone, dist = null, secret = null }) { return this.rpc('gij_register', { p_sid: sid, p_ticket: ticket, p_name: name || '', p_phone: normalizePhone(phone), p_dist: dist, p_secret: secret }); },
  async submit({ sid, pid, secret, answers }) { return this.rpc('gij_submit', { p_sid: sid, p_pid: pid, p_secret: secret, p_answers: answers }); },
  async jemaahView(sid, pid, secret) { return this.rpc('gij_jemaah_view', { p_sid: sid, p_pid: pid || '', p_secret: secret || '' }); },

const API = MODE === 'supabase' ? SupaAPI : LocalAPI;

/* ---------- Geolokasi (pilihan) ---------- */
function haversine(a, b) { const R = 6371000, r = (x) => (x * Math.PI) / 180; const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function getPosition() { return new Promise((res, rej) => { if (!navigator.geolocation) return rej(new Error('x')); navigator.geolocation.getCurrentPosition((p) => res(p.coords), rej, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }); }); }
async function checkGeo(g) {
  if (!g || !g.enabled || g.lat == null || g.lng == null) return { ok: true, dist: null };
  try {
    const c = await getPosition();
    const dist = haversine({ lat: g.lat, lng: g.lng }, { lat: c.latitude, lng: c.longitude });
    return dist <= Number(g.radius) + Math.min(c.accuracy || 0, 100) ? { ok: true, dist: Math.round(dist) } : { ok: false, msg: `Anda berada kira-kira ${Math.round(dist)} m dari masjid. Pendaftaran hanya dibenarkan dalam radius ${g.radius} m.` };
  } catch { return { ok: false, msg: 'Lokasi diperlukan untuk mengesahkan kehadiran. Sila benarkan akses lokasi dan cuba lagi.' }; }
}

/* =====================================================================
   8. PENJANA SOALAN & RINGKASAN
   ---------------------------------------------------------------------
   Jika CONFIG.AI_ENDPOINT diisi → POST { mode:'questions'|'summary', text, count, language:'ms' }
   Balasan: { questions:[{text, options[4], correctIndex}] } atau { points:[...] }
   Contoh proksi (Supabase Edge Function) memanggil Claude API (model 'claude-sonnet-5')
   dengan arahan: "Jana N soalan objektif BM (4 pilihan, 1 betul) daripada teks khutbah,
   balas JSON sahaja". JANGAN letak API key dalam fail ini. Gagal → fallback asas.
   ===================================================================== */
async function callAI(payload) {
  const r = await fetch(CONFIG.AI_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...payload, language: 'ms' }) });
  if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
}
async function generateQuestions(text, count = CONFIG.MAX_Q, difficulty = 'sederhana') {
  count = Math.min(CONFIG.MAX_Q, Math.max(CONFIG.MIN_Q, count));
  if (CONFIG.AI_ENDPOINT) {
    try { const d = await callAI({ mode: 'questions', text, count, difficulty }); const qs = normalizeQuestions(d.questions || d); if (qs.length) return { questions: qs.slice(0, count), source: 'ai' }; }
    catch (e) { console.warn('API AI gagal, guna fallback', e); toast('API AI tidak dapat dihubungi — guna mod asas', 'error'); }
  }
  await sleep(300);
  return { questions: extractQuestions(text, count, difficulty), source: 'auto' };
}
async function generateSummary(text, count = 4) {
  if (CONFIG.AI_ENDPOINT) { try { const d = await callAI({ mode: 'summary', text, count }); if (Array.isArray(d.points) && d.points.length) return { points: d.points.map(String).slice(0, 6) }; } catch (e) { console.warn(e); } }
  return { points: extractSummary(text, count) };
}
function normalizeQuestions(list) {
  if (!Array.isArray(list)) return [];
  return list.filter((q) => q && q.text && Array.isArray(q.options) && q.options.length >= 4)
    .map((q) => ({ text: String(q.text).trim(), options: q.options.slice(0, 4).map((o) => String(o).trim()), correctIndex: Math.min(3, Math.max(0, Number(q.correctIndex) || 0)) }));
}
const STOPWORDS = new Set(('dan yang di ke dari untuk dengan ini itu ada adalah akan pada dalam kita kami mereka ia dia saya anda telah sudah juga tidak bukan atau oleh kerana maka jika bagi lagi hanya serta supaya agar sebagai para setiap semua boleh perlu hendaklah sesungguhnya wahai tuan puan hadirin sekalian allah swt saw marilah sidang jumaat dirahmati muslimin muslimat antara tersebut iaitu bahawa kepada terhadap daripada seperti ketika apabila selepas sebelum sentiasa banyak sangat lebih paling amat walaupun tetapi namun kemudian menjadi merupakan sesuatu seseorang sendiri sehingga melalui manakala begitu bagaimana mengapa kenapa dimana apakah siapa').split(/\s+/));
const GENERIC_DISTRACTORS = ['kesabaran', 'keikhlasan', 'ketakwaan', 'kesyukuran', 'keadilan', 'silaturahim', 'istiqamah', 'amanah', 'kejujuran', 'tawaduk', 'muhasabah', 'persaudaraan'];
const WORD_RE = /[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'-]*/g;
const isKeyword = (w) => w.length >= 5 && !STOPWORDS.has(w.toLowerCase()) && !/-$/.test(w);
function splitSentences(text) { return String(text || '').replace(/\s+/g, ' ').trim().split(/(?<=[.!?؟])\s+/).map((s) => s.trim()).filter((s) => { const n = s.split(' ').length; return n >= 6 && n <= 45; }); }
function keywordFreq(text) {
  const freq = new Map(), display = new Map();
  (String(text).match(WORD_RE) || []).filter(isKeyword).forEach((w) => { const k = w.toLowerCase(); freq.set(k, (freq.get(k) || 0) + 1); if (!display.has(k) || /^[a-z]/.test(display.get(k))) display.set(k, w); });
  return { freq, display };
}
/**
 * Fallback: soalan "isi tempat kosong" daripada ayat penting + 3 pengganggu.
 * `difficulty` ('mudah'|'sederhana'|'susah') condongkan pemilihan kata kunci — kata pendek/kerap
 * untuk 'mudah', kata panjang/jarang untuk 'susah'. (Pemilihan sebenar mengikut tahap kesukaran
 * oleh AI adalah kerja Fasa 4 — di sini nilai sekadar dicatat & disimpan setiap soalan.)
 */
function extractQuestions(text, count, difficulty = 'sederhana') {
  const sentences = splitSentences(text);
  const { freq, display } = keywordFreq(text);
  const pool = [...freq.keys()];
  const isCap = (w) => /^[A-Z]/.test(w || '');
  const diffBias = (w) => difficulty === 'mudah' ? -Math.min(w.length, 12) * 0.4 : difficulty === 'susah' ? Math.min(w.length, 12) * 0.4 : 0;
  const cands = sentences.map((s, idx) => {
    const words = (s.match(WORD_RE) || []).filter(isKeyword);
    if (!words.length) return null;
    const sc = words.map((w) => ({ w, score: Math.min(w.length, 12) + (freq.get(w.toLowerCase()) > 1 ? 3 : 0) + (isCap(w) && s.indexOf(w) > 0 ? 2 : 0) + diffBias(w) })).sort((a, b) => b.score - a.score);
    return { s, idx, key: sc[0].w, score: sc[0].score + Math.min(words.length, 6) };
  }).filter(Boolean);

function extractSummary(text, count = 4) {

function confetti(duration = 3500) {

  const c = document.createElement('canvas'); c.className = 'confetti-canvas'; (document.fullscreenElement || document.body).appendChild(c);
  const ctx = c.getContext('2d'); const dpr = Math.min(2, devicePixelRatio || 1);

  const colors = ['#f0d18a', '#d4af5f', '#10b981', '#34d399', '#ffffff', '#fbe7b0'];
  const parts = Array.from({ length: 200 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight * .4, vx: (Math.random() - .5) * 18, vy: -Math.random() * 17 - 4, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 3, vr: (Math.random() - .5) * .3, c: colors[randInt(colors.length)] }));

    for (const p of parts) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (el < duration) requestAnimationFrame(f); else c.remove();

}

      if (i === n - 1 && n % 3 === 1 && n > 1) [bg, fg] = ['#10b981', '#02130c']; // elak warna sama bersebelahan
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, i * a, (i + 1) * a); ctx.closePath();
      ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = 'rgba(2,44,34,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.save(); ctx.rotate(i * a + a / 2); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = fg;
      const fs = Math.max(10, Math.min(26, (S / 2) * a * .55, S / 26));
      ctx.font = `700 ${fs}px ${Poster.FONT}`;
      let name = sg.name; const maxW = R * .66;
      while (ctx.measureText(name).width > maxW && name.length > 3) name = name.slice(0, -2);
      if (name !== sg.name) name = name.trimEnd() + '…';
      ctx.fillText(name, R - 16, 0); ctx.restore();
    });
    ctx.restore();
    ctx.beginPath(); ctx.arc(c, c, S * .09, 0, Math.PI * 2); ctx.fillStyle = '#064e3b'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#f0d18a'; ctx.stroke();
    Poster.star8(ctx, c, c, S * .05); ctx.fillStyle = '#f0d18a'; ctx.fill();
  },
  indexAt(n, rot) { const a = (Math.PI * 2) / n; let th = (-Math.PI / 2 - rot) % (Math.PI * 2); if (th < 0) th += Math.PI * 2; return Math.floor(th / a) % n; },
  /** Putar sehingga penunjuk berhenti tepat pada segmen targetIdx. */
  spin(canvas, segs, targetIdx, ms, fromRot = 0) {
    return new Promise((resolve) => {
      const n = segs.length, a = (Math.PI * 2) / n, TAU = Math.PI * 2;
      const off = (Math.random() - .5) * .6 * a;                       // kedudukan rawak DALAM segmen
      const targetTh = targetIdx * a + a / 2 + off;
      let endRot = -Math.PI / 2 - targetTh;
      const turns = 6 + randInt(3);
      endRot = endRot - Math.ceil((endRot - fromRot) / TAU) * TAU + turns * TAU; // sentiasa ke hadapan
      const t0 = performance.now(); let lastIdx = this.indexAt(n, fromRot);
      const ease = (t) => 1 - Math.pow(1 - t, 4);                      // easeOutQuart
      const frame = (t) => {
        const p = Math.min(1, (t - t0) / ms), rot = fromRot + (endRot - fromRot) * ease(p);
        this.draw(canvas, segs, rot);
        const idx = this.indexAt(n, rot); if (idx !== lastIdx) { lastIdx = idx; Sound.tick(); }
        if (p < 1 && canvas.isConnected) requestAnimationFrame(frame);
        else { this.draw(canvas, segs, endRot); const li = this.indexAt(n, endRot); canvas.dataset.landed = segs[li].id; canvas.dataset.rot = String(endRot % TAU); resolve({ rot: endRot % TAU, landed: segs[li] }); }
      };
      requestAnimationFrame(frame);
    });
  },
};

const Views = {};

  current: '', timers: [], dataHandler: null, seq: 0,
  parse() { const h = decodeURIComponent(location.hash.slice(1)) || 'j'; const [path, qs = ''] = h.split('?'); return { path, params: Object.fromEntries(new URLSearchParams(qs)) }; },
  cleanup() { this.timers.forEach((t) => { clearInterval(t); clearTimeout(t); }); this.timers = []; this.dataHandler = null; Charts.reset(); },
  render() {
    this.cleanup(); this.seq++;
    let { path, params } = this.parse();
    if (!Views[path]) path = 'j';
    this.current = path;
    document.body.className = 'mode-' + path;
    $('#topExtra').innerHTML = MODE === 'demo' && path === 'admin' ? '<span class="demo-pill" title="Data dalam pelayar ini sahaja">MOD DEMO</span>' : '';
    const app = $('#app'); app.innerHTML = ''; app.className = 'fade-up'; void app.offsetWidth;
    Views[path](app, params);
  },
  /** Pastikan hasil async masih untuk paparan semasa. */
  alive() { const s = this.seq; return () => s === this.seq; },
};
function every(ms, fn) { const t = setInterval(fn, ms); Router.timers.push(t); return t; }
function later(ms, fn) { const t = setTimeout(fn, Math.max(0, ms)); Router.timers.push(t); return t; }
Bus.on(() => Router.dataHandler && Router.dataHandler());

Views.j = async (app, params) => {
  J.app = app; J.key = null; J.freeze = false;
  const alive = Router.alive();
  if (params.s) {
    J.flash = null; // imbasan/pautan baharu → buang mesej lama
    LS.set(K.current, params.s);
    const clean = location.pathname + location.search + '#j';
    if (params.t) {
      // Kod sertai STATIK — sah selagi sesi berstatus 'registration', tiada round-trip RPC diperlukan.
      // Semakan di sini adalah untuk UX pantas sahaja; gij_register/LocalAPI.register di pelayan
      // tetap menyemak semula (pertahanan berganda).
      if (JoinCode.checkClientSide(params.s, params.t)) { LS.set(K.checkin, { sid: params.s, code: params.t }); J.flash = null; }
      else J.flash = 'invalidcode';
    }
    // Pautan "kembali" daripada poster pendaftaran (WhatsApp): pid+sec mengenali semula peranti
    // tanpa perlu isi semula nama/telefon. Disahkan semula oleh pelayan melalui gij_jemaah_view.
    if (params.pid && params.sec) {
      const v = await API.jemaahView(params.s, params.pid, params.sec).catch(() => null);
      if (v && v.ok && v.knownDevice) LS.set(K.me, { participantId: params.pid, secret: params.sec, name: v.name, phone: '' });
    }
    history.replaceState(null, '', clean);
  }
  if (!alive()) return;
  Router.dataHandler = () => J.refresh();
  every(20000, () => J.refresh()); // sandaran jika isyarat masa nyata terlepas
  J.refresh();
};

const A = {
  tab: 'langsung', sel: null, sub: 'butiran', snap: null, app: null,
  TABS: [['langsung', 'Langsung'], ['sesi', 'Sesi & Soalan'], ['templat', 'Templat'], ['ranking', 'Ranking'], ['laporan', 'Laporan'], ['tetapan', 'Tetapan']],
  async reload() { this.snap = await API.snapshot(); this.renderTab(); },
  s(id) { return this.snap.sessions.find((x) => x.id === id); },
  sorted() { return [...this.snap.sessions].sort((a, b) => sessionKey(b).localeCompare(sessionKey(a))); },
  active() { return this.sorted().find((s) => ['registration', 'prepared', 'questions', 'closed', 'drawing'].includes(s.state)) || this.sorted().find((s) => s.state === 'draft') || this.sorted()[0]; },
  body() { return $('#atabBody'); },
  renderTab() { const b = this.body(); if (!b) return; b.innerHTML = ''; b.className = 'fade-up'; void b.offsetWidth; Tabs[this.tab](b); },
};
const pendingSaves = new Map();
const flushSaves = debounce(async () => { const ops = [...pendingSaves.values()]; pendingSaves.clear(); if (ops.length) await API.write(ops); }, 400);
/** Simpan separa (medan yang berubah sahaja) — digabung & ditangguh 400ms. */
function saveSoon(t, row) { const k = t + row.id, prev = pendingSaves.get(k); pendingSaves.set(k, { t, op: 'upsert', row: { ...(prev?.row || {}), ...row } }); flushSaves(); }
async function saveNow(t, row) { const r = await API.write([{ t, op: 'upsert', row }]); if (r && r.ok === false) toast(r.reason || 'Gagal menyimpan', 'error'); return r; }

/** Tutup soalan automatik apabila pemasa tamat (jika panel AJK / skrin terbuka). */
function autoCloseQuestions(snap) {
  if (!snap) return;
  snap.sessions.filter((s) => s.state === 'questions' && s.questionsCloseAt && Clock.now() > Date.parse(s.questionsCloseAt) + CONFIG.ANSWER_GRACE_MS)

function questionsTab(el, s) {

      <p class="muted small">Tampal teks khutbah → klik → ${CONFIG.MIN_Q}–${CONFIG.MAX_Q} soalan objektif dijana & diluluskan, ringkasan ilmu disediakan. Semak & sunting di bawah.</p>

    <section class="card">

      <div id="qList">${qs.length ? qs.map((q, i) => qCardHTML(q, i, locked)).join('') : '<p class="muted center" style="padding:16px 0">Belum ada soalan. Guna Mod 1 Klik di atas.</p>'}</div>
    </section>`;
  $('#summary').oninput = (e) => { saveSoon('sessions', { id: s.id, summary: e.target.value.split('\n').map((l) => l.trim()).filter(Boolean) }); };
  if (locked) return;

  ta.oninput = () => { wc(); saveSoon('sessions', { id: s.id, transcript: ta.value }); };

    const text = ta.value.trim(); const difficulty = $('#qDiff').value;
    const [{ questions, source }, { points }] = await Promise.all([generateQuestions(text, +$('#qN').value, difficulty), generateSummary(text, 4)]);
    const ops = qs.map((q) => ({ t: 'questions', op: 'delete', id: q.id }));
    let approved = 0;
    questions.slice(0, CONFIG.MAX_Q).forEach((q) => { const good = !validateQ(q); if (good) approved++; ops.push({ t: 'questions', op: 'upsert', row: { id: uid('q_'), sessionId: s.id, ...q, source, difficulty, status: good ? 'lulus' : 'draf', createdAt: nowISO() } }); });
    ops.push({ t: 'sessions', op: 'upsert', row: { id: s.id, transcript: text, summary: points } });

  $('#btnAddQ').onclick = async () => { if (qs.length >= CONFIG.MAX_Q) return toast(`Maksimum ${CONFIG.MAX_Q} soalan`, 'error'); await saveNow('questions', { id: uid('q_'), sessionId: s.id, text: '', options: ['', '', '', ''], correctIndex: 0, difficulty: 'sederhana', status: 'draf', source: 'manual', createdAt: nowISO() }); A.reload(); };
  const all = $('#btnAll');
  if (all) all.onclick = async () => {
    const bad = qs.filter((q) => validateQ(q));
    await API.write(qs.filter((q) => !validateQ(q)).map((q) => ({ t: 'questions', op: 'upsert', row: { ...q, status: 'lulus' } })));
    toast(bad.length ? `${bad.length} soalan tidak lengkap tidak diluluskan` : 'Semua soalan diluluskan', bad.length ? 'error' : 'success'); A.reload();
  };
  const listEl = $('#qList');
  const qOf = (e) => A.snap.questions.find((q) => q.id === e.target.closest('[data-qid]')?.dataset.qid);
  listEl.oninput = (e) => { const q = qOf(e); if (!q) return; const f = e.target.dataset.f; if (f === 'text') q.text = e.target.value; else if (f === 'opt') q.options[+e.target.dataset.i] = e.target.value; else return; saveSoon('questions', q); };
  listEl.onchange = (e) => {
    const f = e.target.dataset.f; const q = qOf(e); if (!q) return;
    if (f === 'correct') q.correctIndex = +e.target.value;
    else if (f === 'difficulty') q.difficulty = e.target.value;
    else return;
    saveSoon('questions', q);
  };
  listEl.onclick = async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return; const q = qOf(e); if (!q) return;
    await flushNow();
    if (b.dataset.act === 'approve') { const err = validateQ(q); if (err) return toast(err, 'error'); await saveNow('questions', { ...q, status: 'lulus' }); toast('Soalan diluluskan', 'success'); }
    else if (b.dataset.act === 'unapprove') await saveNow('questions', { ...q, status: 'draf' });
    else if (b.dataset.act === 'delete') { if (!(await confirmDialog('Padam soalan ini?', 'Padam', true))) return; await API.write([{ t: 'questions', op: 'delete', id: q.id }]); }
    A.reload();
  };
}
async function flushNow() { const ops = [...pendingSaves.values()]; pendingSaves.clear(); if (ops.length) await API.write(ops); }

function participantsTab(el, s) {
  const d = A.snap, chain = s.templateId ? Logic.chain(d, s.templateId) : null, qn = Logic.approved(d, s.id).length;
  const rows = d.registrations.filter((r) => r.sessionId === s.id).sort((a, b) => a.regNo - b.regNo).map((r) => {

    const ans = d.answers.filter((a) => a.sessionId === s.id && a.participantId === p.id);
    return { r, p, done: ans.length > 0, correct: ans.filter((a) => a.isCorrect).length, streak: Logic.streakAt(d, p.id, s.id, { chain }), bonus: Logic.bonusFor(d, p.id, s.id, { chain }) };
  }).filter(Boolean);
  el.innerHTML = `<section class="card"><h3>Hadir (${rows.length})</h3>${rows.length ? `<div class="table-wrap"><table>

    <tbody>${rows.map((x) => `<tr><td>#${String(x.r.regNo).padStart(4, '0')}</td><td><b>${esc(x.p.name)}</b></td><td>${esc(formatPhone(x.p.phone))}</td><td>${x.done ? '<span class="badge ok">Sudah jawab</span>' : '<span class="badge">Belum</span>'}</td><td class="num">${x.streak ? '🔥 ' + x.streak : '-'}</td><td class="num">${x.correct}/${qn}${x.bonus ? ` <span class="streak">+${x.bonus}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Belum ada jemaah hadir.</p>'}</section>`;
}

function buildReport(d) {
  const sessions = d.sessions.filter((s) => s.state !== 'draft').sort((a, b) => sessionKey(a).localeCompare(sessionKey(b)));
  const byId = new Map(sessions.map((s) => [s.id, s])), first = new Map();
  d.registrations.forEach((r) => { const s = byId.get(r.sessionId); if (!s) return; const k = sessionKey(s) + '|' + s.id; if (!first.has(r.participantId) || k < first.get(r.participantId)) first.set(r.participantId, k); });
  const rows = sessions.map((s) => {
    const regs = d.registrations.filter((r) => r.sessionId === s.id), ans = d.answers.filter((a) => a.sessionId === s.id), c = ans.filter((a) => a.isCorrect).length;
    const baru = regs.filter((r) => (first.get(r.participantId) || '').endsWith('|' + s.id)).length;
    return { s, hadir: regs.length, baru, tetap: regs.length - baru, menjawab: new Set(ans.map((a) => a.participantId)).size, jawapan: ans.length, betul: c, kadar: pct(c, ans.length), tiket: Logic.tickets(d, s.id).length, pemenang: Logic.winners(d, s.id).length,
      questions: Logic.approved(d, s.id).map((q) => { const qa = ans.filter((a) => a.questionId === q.id), k = qa.filter((a) => a.isCorrect).length; return { q, dijawab: qa.length, betul: k, kadar: pct(k, qa.length) }; }) };
  });
  const months = new Map(); rows.forEach((r) => { const k = r.s.date.slice(0, 7), m = months.get(k) || { baru: 0, tetap: 0, sesi: 0 }; m.baru += r.baru; m.tetap += r.tetap; m.sesi++; months.set(k, m); });
  const per = new Map(); d.registrations.forEach((r) => per.set(r.participantId, (per.get(r.participantId) || 0) + 1));
  const ta = d.answers.length, tc = d.answers.filter((a) => a.isCorrect).length;
  return { rows, months, monthKeys: [...months.keys()].sort().slice(-12), uniq: per.size, sekali: [...per.values()].filter((n) => n === 1).length, tetap: [...per.values()].filter((n) => n >= 2).length, kadar: pct(tc, ta), hadir: d.registrations.length };
}

    const live = mk(tJ, 'Menuntut Ilmu Sepanjang Hayat', off(0), DEMO_TEXTS[0], 'registration');
    // Sesi contoh tambahan berstatus 'prepared' — untuk uji skrin jemaah "Soalan sedang disediakan…"
    const prepped = mk(tK, 'Adab Menuntut Ilmu', off(-3), DEMO_TEXTS[1], 'prepared');
    const names = ['Ahmad Zaki bin Ismail', 'Nurul Huda binti Hassan', 'Muhammad Faris bin Azman', 'Siti Aisyah binti Omar', 'Abdul Rahman bin Yusof', 'Hafizah binti Kamal', 'Iskandar bin Zulkifli', 'Farah Nabilah binti Salleh', 'Khairul Anuar bin Ali', 'Zainab binti Ibrahim', 'Amirul Hakim bin Rosli', 'Nor Azlina binti Mat', 'Haji Osman bin Daud', 'Rohani binti Ahmad', 'Luqman Hakim bin Said', 'Mariam binti Yaakob'];
    const people = names.map((n, i) => ({ n, phone: '01' + String(2 + (i % 7)) + String(3000000 + i * 411731).slice(0, 7), i }));
    const pattern = (i) => i < 4 ? [1, 1, 1, 1, 1, 1, 1, 1] : i < 7 ? [1, 1, 1, 1, 1, 1, 0, 1] : i < 11 ? [0, 0, 0, 0, 0, 1, 1, 1] : [0, 1, 0, 1, 0, 0, 1, 0].map((v, k) => ((k + i) % 3 === 0 ? 1 : v));
    const attend = (s, person, ratio, answer = true) => {
      const at = new Date(`${s.date}T${s.startTime}`).toISOString();
      let p = d.participants.find((x) => x.phone === person.phone);
      if (!p) { p = { id: uid('p_'), name: person.n, phone: person.phone, secret: randomSecret(), createdAt: at }; d.participants.push(p); }
      if (d.registrations.some((r) => r.sessionId === s.id && r.participantId === p.id)) return;
      d.registrations.push({ id: uid('r_'), sessionId: s.id, participantId: p.id, regNo: d.registrations.filter((r) => r.sessionId === s.id).length + 1, checkinAt: at, dist: null, createdAt: at });
      if (answer) Logic.approved(d, s.id).forEach((q) => { const ci = Math.random() < ratio ? q.correctIndex : randInt(4); d.answers.push({ id: uid('a_'), sessionId: s.id, participantId: p.id, questionId: q.id, choiceIndex: ci, isCorrect: ci === q.correctIndex, createdAt: at }); });
    };
    [...jum, ...kul].sort((a, b) => sessionKey(a).localeCompare(sessionKey(b))).forEach((s) => {
      const ji = jum.indexOf(s), ki = kul.indexOf(s);
      people.forEach((p) => { if (ji >= 0 && pattern(p.i)[ji]) attend(s, p, p.i < 4 ? .85 : .65); if (ki >= 0 && (p.i + ki) % 2 === 0 && p.i < 12) attend(s, p, .7); });
    });
    [['Tan Sri Kamarul bin Hashim', '0192223344', 2], ['Aminah binti Salleh', '0145556677', 5]].forEach(([n, phone, k]) => attend(jum[k], { n, phone }, .6));
    people.slice(0, 8).forEach((p) => attend(live, p, 0, false)); // 8 sudah hadir hari ini (belum menjawab)
    people.slice(8, 12).forEach((p) => attend(prepped, p, 0, false)); // sesi 'prepared' — hadir, menunggu soalan disediakan
    [...jum, ...kul].forEach((s) => s.prizes.slice(0, 2).forEach((prize, i) => {
      const pool = Logic.pool(d, s.id); if (!pool.length) return;
      const at = new Date(`${s.date}T${s.endTime}`).toISOString();
      d.winners.push({ id: uid('w_'), sessionId: s.id, participantId: pool[randInt(pool.length)], prize, order: i + 1, spinMs: 7000, revealAt: at, wheel: [], createdAt: at });
    }));
    return { ok: true };
  });
}

function paintBrand(name) { if (!name) return; $('#brandSub').textContent = name; $('#footMasjid').textContent = name; }
(async function boot() {
  Theme.init();
  Bus.init();
  if (MODE === 'supabase') { try { await SupaAPI.init(); } catch (e) { toast('Gagal menyambung ke Supabase', 'error'); console.error(e); } }
  else paintBrand(LocalAPI.read().settings.masjidName);
  window.addEventListener('hashchange', () => Router.render());
  Router.render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW', e));
})();
</script>
